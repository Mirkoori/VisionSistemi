<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ECE9E3">
<title>Nuovo evento</title>
<link rel="stylesheet" href="/css/hub.css">
</head>
<body>
<div class="app">
  <div class="hero plain"><span class="tag">Hub Evento · Per noi</span><h1 class="big">Nuovo evento</h1></div>
  <div class="list" id="main">
    <form class="card" id="f" autocomplete="off">
      <label for="pin">PIN di amministrazione</label>
      <input type="password" id="pin" required autocomplete="off">
      <label for="name">Nome evento</label>
      <input type="text" id="name" required maxlength="120" placeholder="Es. Congresso regionale">
      <label for="date">Data</label>
      <input type="date" id="date">
      <label for="venue">Location</label>
      <input type="text" id="venue" maxlength="160" placeholder="Es. Hotel, sala">
      <div class="btns"><button class="btn primary" type="submit">Crea evento</button></div>
      <p class="msg" id="msg" role="status"></p>
    </form>
    <div id="out"></div>
  </div>
</div>
<script type="module" src="/js/nuovo.js"></script>
</body>
</html>
